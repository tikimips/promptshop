<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TVE · GGO 2026 Offsite — Photobooth Architecture</title>
<style>
  body { margin: 0; background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'San Francisco', 'Helvetica Neue', Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2eea6d"/>
    </marker>
  </defs>

  <text x="620" y="32" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">AI PHOTOBOOTH — SYSTEM ARCHITECTURE</text>
  <text x="620" y="60" text-anchor="middle" fill="#ffd23f" font-size="16" font-weight="700" letter-spacing="2">TVE · GGO 2026 OFFSITE</text>

  <!-- Guest -->
  <rect x="30" y="120" width="170" height="110" rx="14" fill="#1a2a5e" stroke="#4a6bd4" stroke-width="2"/>
  <text x="115" y="160" text-anchor="middle" fill="#fff" font-size="30">🧑‍🤝‍🧑</text>
  <text x="115" y="192" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Guests (1–5)</text>
  <text x="115" y="214" text-anchor="middle" fill="#9fb3e8" font-size="12">webcam + touchscreen</text>

  <!-- Kiosk browser -->
  <rect x="270" y="80" width="300" height="260" rx="14" fill="#11202f" stroke="#2f81f7" stroke-width="2"/>
  <text x="420" y="112" text-anchor="middle" fill="#79b8ff" font-size="17" font-weight="800">KIOSK BROWSER (Chrome)</text>
  <text x="420" y="140" text-anchor="middle" fill="#c9d1d9" font-size="13">5 booth pages: superhero · anime ·</text>
  <text x="420" y="158" text-anchor="middle" fill="#c9d1d9" font-size="13">cyberpunk · sports · film</text>
  <line x1="290" y1="172" x2="550" y2="172" stroke="#30363d"/>
  <text x="420" y="194" text-anchor="middle" fill="#8b949e" font-size="12">camera capture + face ovals</text>
  <text x="420" y="213" text-anchor="middle" fill="#8b949e" font-size="12">countdown + warm screen flash</text>
  <text x="420" y="232" text-anchor="middle" fill="#8b949e" font-size="12">face detection (pico.js, on-device)</text>
  <text x="420" y="251" text-anchor="middle" fill="#8b949e" font-size="12">portrait / landscape crop + Print</text>
  <line x1="290" y1="265" x2="550" y2="265" stroke="#30363d"/>
  <text x="420" y="288" text-anchor="middle" fill="#8b949e" font-size="12">logos &amp; posters loaded live from</text>
  <text x="420" y="306" text-anchor="middle" fill="#8b949e" font-size="12">ESPN CDN + Wikipedia API</text>

  <!-- Vercel -->
  <rect x="650" y="80" width="290" height="260" rx="14" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="795" y="112" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">VERCEL (promptshop.ai)</text>
  <text x="795" y="140" text-anchor="middle" fill="#c9d1d9" font-size="13">Next.js app</text>
  <line x1="670" y1="154" x2="920" y2="154" stroke="#30363d"/>
  <text x="795" y="177" text-anchor="middle" fill="#8b949e" font-size="12">password gate (middleware)</text>
  <text x="795" y="196" text-anchor="middle" fill="#8b949e" font-size="12">serves the 5 booth pages</text>
  <text x="795" y="215" text-anchor="middle" fill="#8b949e" font-size="12">API route per theme = the prompts</text>
  <text x="795" y="234" text-anchor="middle" fill="#8b949e" font-size="12">Gemini key kept server-side (env var)</text>
  <text x="795" y="253" text-anchor="middle" fill="#8b949e" font-size="12">CDN caches select-screen art</text>
  <line x1="670" y1="267" x2="920" y2="267" stroke="#30363d"/>
  <text x="795" y="290" text-anchor="middle" fill="#8b949e" font-size="12">auto-deploys on every push from</text>
  <text x="795" y="308" text-anchor="middle" fill="#8b949e" font-size="12">GitHub repo (tikimips/promptshop)</text>

  <!-- Gemini -->
  <rect x="1010" y="120" width="200" height="180" rx="14" fill="#1c1430" stroke="#a371f7" stroke-width="2"/>
  <text x="1110" y="155" text-anchor="middle" fill="#d2a8ff" font-size="17" font-weight="800">GOOGLE GEMINI</text>
  <text x="1110" y="180" text-anchor="middle" fill="#c9d1d9" font-size="13">gemini-3.1-flash-image</text>
  <text x="1110" y="206" text-anchor="middle" fill="#8b949e" font-size="12">faces + prompt in →</text>
  <text x="1110" y="225" text-anchor="middle" fill="#8b949e" font-size="12">one finished photo out</text>
  <text x="1110" y="254" text-anchor="middle" fill="#ffd23f" font-size="13" font-weight="700">~$0.07 / photo</text>
  <text x="1110" y="276" text-anchor="middle" fill="#8b949e" font-size="11">Tier 1 pay-as-you-go</text>

  <!-- Printing station -->
  <rect x="270" y="560" width="300" height="120" rx="14" fill="#0e2a1a" stroke="#2eea6d" stroke-width="2"/>
  <text x="420" y="598" text-anchor="middle" fill="#2eea6d" font-size="17" font-weight="800">🖨 PRINTING STATION</text>
  <text x="420" y="626" text-anchor="middle" fill="#c9d1d9" font-size="13">photo auto-downloads to kiosk</text>
  <text x="420" y="646" text-anchor="middle" fill="#c9d1d9" font-size="13">as 4x6-ready JPEG (2:3 or 3:2)</text>

  <!-- GitHub -->
  <rect x="650" y="560" width="290" height="120" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="795" y="598" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">GITHUB</text>
  <text x="795" y="626" text-anchor="middle" fill="#c9d1d9" font-size="13">source of truth for all booth code</text>
  <text x="795" y="646" text-anchor="middle" fill="#c9d1d9" font-size="13">push → Vercel builds &amp; ships</text>

  <!-- Arrows -->
  <line x1="200" y1="175" x2="262" y2="175" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="231" y="163" text-anchor="middle" fill="#8b949e" font-size="11">poses</text>

  <line x1="570" y1="160" x2="642" y2="160" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="606" y="148" text-anchor="middle" fill="#8b949e" font-size="11">face crops</text>
  <line x1="642" y1="200" x2="570" y2="200" stroke="#2eea6d" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="606" y="222" text-anchor="middle" fill="#2eea6d" font-size="11">finished photo</text>

  <line x1="940" y1="160" x2="1002" y2="160" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="971" y="148" text-anchor="middle" fill="#8b949e" font-size="11">prompt + faces</text>
  <line x1="1002" y1="200" x2="940" y2="200" stroke="#2eea6d" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="971" y="222" text-anchor="middle" fill="#2eea6d" font-size="11">image</text>

  <line x1="420" y1="340" x2="420" y2="552" stroke="#2eea6d" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="500" y="450" text-anchor="middle" fill="#2eea6d" font-size="11">print-ready file</text>

  <line x1="795" y1="552" x2="795" y2="348" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="862" y="450" text-anchor="middle" fill="#8b949e" font-size="11">auto-deploy</text>
</svg>
</body>
</html>
